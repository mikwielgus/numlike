[package]
name = "numlike"
version = "0.10.7"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Numeric traits for generic mathematics. Less restrictive alternative to num-traits."
repository = "https://github.com/mikwielgus/numlike"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["mathematics", "numerics", "no_std"]
categories = ["algorithms", "science", "no-std"]
edition = "2024"
rust-version = "1.85"

[features]
default = ["std"]

## Disable for `no_std` compatibility.
std = []

## Use `libm` to implement transcendental functions if `std` is disabled.
libm = ["dep:libm"]

## Enables `serde` support (derives `Serialize` and `Deserialize` traits).
serde = ["dep:serde"]

## Enables `maplike` support (implements `Scalarlike` traits).
maplike = ["dep:maplike"]

## Enables `undoredo` support (implements `ApplyDelta` trait).
undoredo = ["dep:undoredo"]

[dependencies]
document-features = { version = "0.2", optional = true }
libm = { version = "0.2", optional = true }
maplike = { version = "0.17", optional = true }
pastey = "0.2"
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
undoredo = { version = "0.17", optional = true }

[package.metadata.release]
pre-release-replacements = [
  { file = "README.md", search = 'numlike = \{ version = "[^"]+"([^}]*)\}', replace = '{{crate_name}} = { version = "{{version}}"$1}' },
]

# Enable all feature flags for docs.rs and use scraped examples.
[package.metadata.docs.rs]
cargo-args = ["--all-features", "-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
